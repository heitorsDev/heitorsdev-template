name: ci

on:
  pull_request:
  push:
    branches:
      - "release/**"

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - name: verify release path
        # Bash + throwaway git repos; the bump rule itself is covered on both
        # legs by npm test.
        if: runner.os == 'Linux'
        run: bash scripts/verify-release.sh
